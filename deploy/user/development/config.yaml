total_shutdown_timeout:
  15s

http_server:
  port: 5001
  cors:
    allow_origins: "*"
  shutdown_context_timeout: "10s"

repository:
  cache_prefix: user
  cache_enabled: true

cache_config:
  ttl: "24h"
  write_ttl: "10s"

# Database configuration
# Sensitive values (host, user, password, db_name) come from environment variables in deploy/.env
# Set: USER__POSTGRES_DB__HOST, USER__POSTGRES_DB__USER, USER__POSTGRES_DB__PASSWORD, USER__POSTGRES_DB__DB_NAME
# Defaults below are overridden by environment variables if set
postgres_db:
  host: user-db  # Overridden by USER__POSTGRES_DB__HOST env var
  port: 5432     # Overridden by USER__POSTGRES_DB__PORT env var
  user: user_admin  # Overridden by USER__POSTGRES_DB__USER env var
  password: password123  # Overridden by USER__POSTGRES_DB__PASSWORD env var
  db_name: user_db  # Overridden by USER__POSTGRES_DB__DB_NAME env var
  ssl_mode: disable
  max_idle_conns: 15
  max_open_conns: 100
  conn_max_lifetime: 5
  path_of_migration: './userapp/repository/migrations'

# Redis configuration
# Values come from environment variables in deploy/.env
# Set: USER__REDIS__HOST, USER__REDIS__PORT
# Defaults below are overridden by environment variables if set
redis:
  host: user-redis  # Overridden by USER__REDIS__HOST env var
  Port: 6379        # Overridden by USER__REDIS__PORT env var

logger:
  file_path: "logs/user/service.log"
  use_local_time: true
  file_max_size_in_mb: 10
  file_max_age_in_days: 7

user:
  avatar:
    upload_file_dir: "./public/uploads/avatars/"
    maximum_file_size: 3 # MB
    valid_image_formats:
      - "image/png"
      - "image/jpeg"

guard:
  sign_key: "roham"
  access_expiration_time: 30m
  refresh_expiration_time: 50m
  access_subject: "at_user"
  refresh_subject: "rf_user"
  opa_policy:
    package: "user.authz"
    rule: "allow"
    policy: "./deploy/user/development/user.rego"
    is_path: true


